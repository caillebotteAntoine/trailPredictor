<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dataset / Features — Trail Predictor</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="lib/plotly.min.js"></script>
  <!-- modules run before Alpine (deferred scripts keep the document order) -->
  <script type="module" src="js/dataset.js"></script>
  <script defer src="vendor/alpine-3.14.9.min.js"></script>
</head>
<body x-data="datasetPage">
  <header class="topbar">
    <h1><a href="index.html">Trail Predictor</a> · Dataset / Features</h1>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Paramètres du dataset</h2>
      <label class="field">Distance minimale (km)
        <input type="number" min="1" max="200" step="1"
               x-model.number="params.minDistance" @change="loadDataset()">
      </label>
      <label class="field">Distance maximale (km)
        <input type="number" min="2" max="300" step="1"
               x-model.number="params.maxDistance" @change="loadDataset()">
      </label>
      <label class="field">Taille des segments (m)
        <input type="number" min="100" max="5000" step="100"
               x-model.number="params.segmentWidth" @change="loadDataset()">
      </label>
      <label class="field">Cible
        <select x-model="target" @change="onTargetChange()">
          <template x-for="name in targets" :key="name">
            <option :value="name" x-text="name" :selected="name === target"></option>
          </template>
        </select>
      </label>
      <label class="field">Zones cardiaques
        <select x-model="zonesChoice" @change="onZonesChange()"
                title="Saisie libre, ou zones (règle 1-SE) d'une optimisation sauvegardée depuis la page « Zones cardiaques ».">
          <option value="">Saisie libre</option>
          <template x-for="zones in savedZones" :key="zones.key">
            <option :value="zones.key" x-text="zonesLabel(zones)" :selected="zones.key === zonesChoice"></option>
          </template>
        </select>
      </label>
      <label class="field" x-show="zonesChoice === ''">Seuils des zones (bpm)
        <input type="text" x-model="typedCuts" @change="onZonesChange()">
        <small>Seuils croissants séparés par des virgules : N seuils → N+1 zones.</small>
      </label>
      <small x-show="savedCuts !== null" x-text="`Seuils : ${(savedCuts ?? []).join(', ')} bpm`"></small>
      <p class="alert error" x-show="cutsError" x-text="`Seuils invalides : ${cutsError}`"></p>
      <small x-show="nRows !== null" x-text="`${nRows} lignes`"></small>
    </aside>

    <main class="content">
      <h2>Dataset / Features</h2>

      <p class="alert error" x-show="error" x-text="error"></p>

      <div class="progress" x-show="progress !== null">
        <div class="progress-bar" :style="`width: ${Math.round((progress ?? 0) * 100)}%`"></div>
        <span x-text="progressMessage"></span>
      </div>

      <div class="split" x-show="loaded">
        <section class="panel">
          <h3>Features</h3>
          <label class="field">Rechercher
            <input type="search" x-model="filters.search" @input.debounce.300ms="refreshFeatures()">
          </label>
          <fieldset class="groups">
            <legend>Groupes <small>(aucun coché : tous)</small></legend>
            <template x-for="group in groups" :key="group">
              <label>
                <input type="checkbox" :value="group" x-model="filters.groups" @change="refreshFeatures()">
                <span x-text="groupLabel(group)"></span>
              </label>
            </template>
          </fieldset>
          <div class="row">
            <label class="field">|ρ| minimum : <span x-text="filters.minAbs.toFixed(2)"></span>
              <input type="range" min="0" max="1" step="0.01"
                     x-model.number="filters.minAbs" @change="refreshFeatures()">
            </label>
            <label class="field">Manquantes max : <span x-text="`${filters.maxMissing} %`"></span>
              <input type="range" min="0" max="100" step="1"
                     x-model.number="filters.maxMissing" @change="refreshFeatures()">
            </label>
          </div>
          <button type="button" @click="resetFilters()">Réinitialiser les filtres</button>

          <div class="row preset">
            <label class="field">Preset
              <select x-model="preset">
                <template x-for="option in presets" :key="option.value">
                  <option :value="option.value" x-text="option.label"></option>
                </template>
              </select>
            </label>
            <button type="button" @click="applyPreset(false)">Remplacer</button>
            <button type="button" @click="applyPreset(true)">Ajouter</button>
            <button type="button" @click="setSelection([])">Vider</button>
          </div>

          <small x-text="`${rows.length} feature(s) affichée(s) sur ${ranked.length} · cochez pour afficher le graphique ; clic sur un en-tête pour trier.`"></small>
          <p class="alert" x-show="loaded && !rows.length">Aucune feature ne correspond aux filtres.</p>
          <div class="table-wrap" x-show="rows.length">
            <table class="features">
              <thead>
                <tr>
                  <th>✓</th>
                  <template x-for="column in columns" :key="column.field">
                    <th @click="sortBy(column.field)" :title="column.help ?? ''">
                      <span x-text="column.label"></span>
                      <span x-text="sortMarker(column.field)"></span>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in sortedRows" :key="row.name">
                  <tr :class="{ selected: selection.includes(row.name) }">
                    <td><input type="checkbox" :checked="selection.includes(row.name)"
                               @change="toggle(row.name, $event.target.checked)"></td>
                    <td x-text="row.name"></td>
                    <td class="number" x-text="row.spearman === null ? '—' : `${row.spearman >= 0 ? '+' : ''}${row.spearman.toFixed(2)}`"></td>
                    <td class="number" x-text="row.missing_pct.toFixed(1)"></td>
                    <td x-text="groupLabel(row.group)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <details>
            <summary x-text="`Sélection : ${selection.length} feature(s)`"></summary>
            <p x-text="selection.length ? selection.join(' · ') : 'Aucune feature sélectionnée.'"></p>
          </details>
          <details x-show="nonNumeric.length">
            <summary x-text="`${nonNumeric.length} feature(s) non numérique(s) ignorée(s)`"></summary>
            <p x-text="`Un nuage de points nécessite une abscisse numérique : ${nonNumeric.join(', ')}`"></p>
          </details>
        </section>

        <section class="dataset-charts">
          <h3 x-text="`Graphiques (${selection.length} feature(s))`"></h3>
          <p class="alert warning" x-show="selection.length > manyCharts">
            Un grand nombre de graphiques peut ralentir l'affichage.
          </p>
          <fieldset>
            <legend>Colonnes par ligne</legend>
            <label><input type="radio" value="1" x-model.number="columnsPerRow" @change="resizeCharts()"> 1</label>
            <label><input type="radio" value="2" x-model.number="columnsPerRow" @change="resizeCharts()"> 2</label>
          </fieldset>
          <div class="chart-grid" :style="`grid-template-columns: repeat(${columnsPerRow}, minmax(0, 1fr))`">
            <template x-for="chart in chartEntries" :key="chart.id">
              <div class="chart">
                <p class="alert warning" x-show="chartErrors[chart.id]"
                   x-text="`${chart.title} : ${chartErrors[chart.id]}`"></p>
                <p class="loading" x-show="chartLoading[chart.id]">Chargement du graphique…</p>
                <div class="chart-plot" :id="chart.id"></div>
              </div>
            </template>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
