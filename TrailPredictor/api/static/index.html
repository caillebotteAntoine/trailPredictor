<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trail Predictor</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- modules run before Alpine (deferred scripts keep the document order) -->
  <script type="module" src="js/app.js"></script>
  <script defer src="vendor/alpine-3.14.9.min.js"></script>
</head>
<body x-data="home">
  <header class="topbar">
    <h1>Trail Predictor</h1>
    <span class="status" :class="serverStatus" x-text="statusLabel"></span>
  </header>

  <main>
    <p class="intro">Analyse d'activités Strava et prédiction d'allure par segment.</p>

    <nav class="cards">
      <template x-for="page in pages" :key="page.id">
        <article class="card" :class="{ disabled: !page.ready }">
          <h2 x-text="page.title"></h2>
          <p x-text="page.description"></p>
          <span class="badge" x-show="!page.ready">Bientôt</span>
        </article>
      </template>
    </nav>
  </main>
</body>
</html>
