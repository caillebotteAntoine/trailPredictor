# Install once: `poetry install` then `poetry run pre-commit install` (hooks then run on every `git commit`).
# Run manually on all files: `poetry run pre-commit run --all-files`; skip once with `git commit --no-verify`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.2.0
    hooks:
      # Removes trailing spaces at the end of lines.
      # Modifies the files in place; re-stage them and commit again.
      - id: trailing-whitespace
      # Ensures every file ends with exactly one newline.
      # Modifies the files in place; re-stage them and commit again.
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # Detects "local" dead code: unused imports / variables, redefinitions
      # and commented-out code, and fixes it automatically when possible.
      # Must run BEFORE formatting (ruff recommendation).
      - id: ruff
        name: ruff (dead code)
        args:
          [
            "--select=F401,F811,F841,ERA001",
            "--fix",
            "--exit-non-zero-on-fix",
          ]
      # Checks that public functions and classes have well-formed docstrings.
      # NumPy convention set in [tool.ruff.lint.pydocstyle] of pyproject.toml
      # (tests are excluded there).
      - id: ruff
        name: ruff (docstrings)
        args: ["--select=D"]
      # Formats the code (indentation, quotes, line length...) like Black.
      # Modifies the files in place; re-stage them and commit again.
      - id: ruff-format

  - repo: https://github.com/osprey-oss/deptry.git
    rev: 0.25.0
    hooks:
      # Checks that imports and pyproject.toml dependencies are consistent:
      # missing, unused or transitive dependencies are reported.
      - id: deptry
        entry: poetry run deptry .
        args: ["--per-rule-ignores=DEP002=jax|numpyro|netcdf4|nbformat"]

  - repo: local
    hooks:
      # Detects "global" dead code: functions, classes, methods and attributes
      # never referenced anywhere in the project (false positives go in vulture_whitelist.py).
      - id: vulture
        name: vulture (dead code)
        entry: poetry run vulture
        language: system
        types: [python]
        args: [TrailPredictor, pages, app.py, vulture_whitelist.py]
        pass_filenames: false   # analyse the whole project, not only staged files
        require_serial: true

      # Static analysis of the source code: bugs, code smells and style issues.
      # The docparams plugin also checks that NumPy docstrings document every parameter, return and raise.
      - id: pylint
        name: pylint
        entry: poetry run python -m pylint
        language: system
        types: [python]
        # regpath.py is an exploration script, not part of the package.
        exclude: ^(tests/|regpath\.py$)
        args:
          [
            "-rn",
            "-sn",
            "--load-plugins=pylint.extensions.docparams",
            "--default-docstring-type=numpy",
            "--accept-no-yields-doc=no",
            "--accept-no-return-doc=no",
            "--accept-no-raise-doc=no",
            "--accept-no-param-doc=no",
            # Plot classes subclass Dataset / RunningActivities whose .plot
            # property returns them: the cycle is intended, broken by lazy
            # imports at runtime.
            "--disable=cyclic-import",
          ]

      # Same static analysis as above, applied to the tests/ directory only.
      # Rules that clash with pytest are disabled: test functions need no
      # docstring, fixtures are injected as same-named arguments, and
      # fixtures need no Returns section.
      - id: pylint
        name: pylint (tests)
        entry: poetry run python -m pylint
        language: system
        types: [python]
        files: ^tests/
        args:
          [
            "-rn",
            "-sn",
            "--load-plugins=pylint.extensions.docparams",
            "--default-docstring-type=numpy",
            "--disable=missing-function-docstring,redefined-outer-name,missing-return-doc",
          ]
