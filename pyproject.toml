[project]
name = "TrailPredictor"
version = "0.1.0"
description = ""
authors = [
    {name = "caillebotte",email = "caillebotte.antoine@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "fitdecode (>=0.11.0,<0.12.0)",
    "streamlit (>=1.66.1,<2.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "nbformat (>=5.11.1,<6.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "pydeck (>=0.9.3,<0.10.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "TrailPredictor" }
]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Exploration notebooks may keep commented-out code.
"*.ipynb" = ["ERA001"]

[dependency-groups]
dev = [
    "ipywidgets (>=8.1.9,<9.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "deptry (>=0.25.1,<0.26.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "vulture (>=2.16,<3.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pandas-stubs (>=3.1.0.261029,<4.0.0.0)"
]

[tool.mypy]
# These libraries ship no type information and have no stub package.
[[tool.mypy.overrides]]
module = ["plotly.*", "sklearn.*", "fitdecode.*", "pydeck.*"]
ignore_missing_imports = true
